<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payout Rules Editor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Bootstrap has no purple alert, and "additional profit" needs to read as
         its own state rather than as a warning. Same colours MB-Tracker uses. */
      .alert-purple {
        --bs-alert-color: #4b2a7b;
        --bs-alert-bg: #e7dbf7;
        --bs-alert-border-color: #d3bff0;
      }
      .text-none { text-transform: none; letter-spacing: normal; }
      .border-dashed { border-style: dashed !important; }
      .pane-title {
        font-size: .75rem; font-weight: 600; letter-spacing: .05em;
        text-transform: uppercase; color: var(--bs-secondary-color); margin-bottom: .75rem;
      }
      .tabbar {
        display: flex; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap;
        border-bottom: 1px solid var(--bs-border-color); scrollbar-width: thin;
      }
      .tabbar-item {
        flex-shrink: 0; border: 0; background: none; padding: .55rem 1rem;
        color: var(--bs-secondary-color); font-weight: 500;
        border-bottom: 3px solid transparent;
      }
      .tabbar-item:hover { color: var(--bs-body-color); background: var(--bs-tertiary-bg); }
      .tabbar-item.active {
        color: var(--bs-primary); font-weight: 700;
        border-bottom-color: var(--bs-primary);
        background: rgba(var(--bs-primary-rgb), .08);
      }
      .tabbar.fade-right { mask-image: linear-gradient(to right, #000 calc(100% - 3rem), transparent); }
      .tabbar.fade-left { mask-image: linear-gradient(to left, #000 calc(100% - 3rem), transparent); }
      .tabbar.fade-both { mask-image: linear-gradient(to right, transparent, #000 3rem, #000 calc(100% - 3rem), transparent); }
      .tabbar-sm .tabbar-item { padding: .35rem .75rem; font-size: .875rem; }
      .tabbar-extra { flex-shrink: 0; display: flex; align-items: center; padding: 0 .5rem; }
      /* On a wide screen the page itself does not scroll: the sport tabs stay
         put and compatibility and markets scroll side by side, each on its own.
         Narrower than that, the two stack and the page scrolls as usual. */
      @media (min-width: 992px) {
        .app { height: 100vh; display: flex; flex-direction: column; }
        .split { flex-grow: 1; min-height: 0; }
        .split > .pane { height: 100%; overflow-y: auto; padding-bottom: 1rem; }
      }
    </style>
  </head>
  <body>
    <div id="payout-rules-root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
